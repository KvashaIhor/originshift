# Publishes to PyPI on a version tag, via Trusted Publishing: no API token is
# stored anywhere, and the upload carries PEP 740 attestations tying the
# artefacts to this workflow and commit.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # attaching the SBOM to the release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build
      - run: python -m build
      # The corpus ships inside the package, so a wheel that cannot resolve a
      # good is a broken release however well it built.
      - name: Check the built wheel resolves
        run: |
          python -m venv /tmp/v
          /tmp/v/bin/pip install dist/*.whl
          /tmp/v/bin/originshift resolve --good 8708.29 \
            --inputs 7208.10,8708.99 --country VN
      # An SBOM is a procurement line item, and with one runtime dependency
      # it costs one step.
      - name: Generate a CycloneDX SBOM
        run: |
          python -m pip install cyclonedx-bom
          python -m cyclonedx_py environment --output-format json \
            --outfile "sbom-$GITHUB_REF_NAME.cdx.json" || \
          cyclonedx-py environment --output-format json \
            --outfile "sbom-$GITHUB_REF_NAME.cdx.json"
      - uses: softprops/action-gh-release@v2
        with:
          files: sbom-*.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # Trusted Publishing needs this, and nothing else
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
