[project]
name = "originshift"
version = "0.2.2"
description = "Non-preferential rules of origin, as data. Answers which country a good is legally from, and cites the rule."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["customs", "rules-of-origin", "trade-compliance", "hs-codes", "cbp", "usmca"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Legal Industry",
  "Intended Audience :: Financial and Insurance Industry",
  "Intended Audience :: Manufacturing",
  "Intended Audience :: Developers",
  "Topic :: Office/Business",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
# certifi only: python.org builds ship no usable trust store, and every source
# this package reads is fetched over HTTPS from a government endpoint.
dependencies = ["certifi"]

[project.urls]
Homepage = "https://github.com/KvashaIhor/originshift"
Source = "https://github.com/KvashaIhor/originshift"
Issues = "https://github.com/KvashaIhor/originshift/issues"
Documentation = "https://github.com/KvashaIhor/originshift/blob/main/docs/scope.md"
Changelog = "https://github.com/KvashaIhor/originshift/releases"

[project.scripts]
originshift = "originshift.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
ingest = ["pdfplumber", "beautifulsoup4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/originshift"]


# Static analysis. The selection is deliberately narrow: rules that find real
# defects, not rules that enforce a house style. It earned its place on the
# first run by catching two provenance dates built from local time and a file
# that was never closed.
[tool.ruff.lint]
select = ["E", "F", "DTZ", "SIM"]
ignore = [
  "E501",    # line length is not a defect, and the corpus quotes long rule text
  "SIM114",  # merging branches that share a body hides why they are separate
]
