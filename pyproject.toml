[project]
name = "originshift"
version = "0.1.0"
description = "Non-preferential rules of origin, as data. Answers which country a good is legally from, and cites the rule."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["customs", "rules-of-origin", "trade-compliance", "hs-codes", "cbp", "usmca"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Legal Industry",
  "Intended Audience :: Developers",
  "Topic :: Office/Business",
  "Programming Language :: Python :: 3",
]
# certifi only: python.org builds ship no usable trust store, and every source
# this package reads is fetched over HTTPS from a government endpoint.
dependencies = ["certifi"]

# [project.urls]
# Fill in once the repository has a home. Publishing metadata that points at a
# URL which does not resolve is worse than publishing none.
# Homepage = "..."
# Source = "..."

[project.scripts]
originshift = "originshift.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]
ingest = ["pdfplumber", "beautifulsoup4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/originshift"]
